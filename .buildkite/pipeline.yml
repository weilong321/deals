env:
  UV_VERSION: "0.5.14"

steps:
  - label: "Pre-commit, tests, and deploy"
    key: validate
    command: |
      set -euo pipefail

      curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      export PATH="$$HOME/.local/bin:$$PATH"
      uv sync --locked
      uv run pre-commit run --all-files --show-diff-on-failure
      uv run pytest
      if [ "$$BUILDKITE_BRANCH" = "main" ]; then
        PREFECT_API_URL="$(buildkite-agent secret get PREFECT_API_URL)"
        PREFECT_API_KEY="$(buildkite-agent secret get PREFECT_API_KEY)"
        if [ -z "$$PREFECT_API_URL" ] || [ -z "$$PREFECT_API_KEY" ]; then
          echo "PREFECT_API_URL and PREFECT_API_KEY must be configured as Buildkite secrets."
          exit 1
        fi

        export PREFECT_API_URL PREFECT_API_KEY
        uv run prefect deploy \
          --no-prompt \
          --prefect-file prefect.yaml \
          --name ozbargain-latest-deals
      fi
