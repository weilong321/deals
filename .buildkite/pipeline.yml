env:
  UV_VERSION: "0.5.14"

steps:
  - label: "Pre-commit and tests"
    key: validate
    command: |
      set -euo pipefail

      SOURCE_COMMIT="$(git rev-parse HEAD)"
      buildkite-agent meta-data set "source-commit" "$$SOURCE_COMMIT"

      curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      export PATH="$$HOME/.local/bin:$$PATH"
      uv sync --locked
      uv run pre-commit run --all-files --show-diff-on-failure
      uv run pytest

  - label: "Build image from branch commit"
    key: buildimage
    depends_on: validate
    command: |
      set -euo pipefail

      REGISTRY_IMAGE="$(buildkite-agent secret get REGISTRY_IMAGE)"
      GHCR_USERNAME="$(buildkite-agent secret get GHCR_USERNAME)"
      GHCR_TOKEN="$(buildkite-agent secret get GHCR_TOKEN)"

      if [ -z "$$REGISTRY_IMAGE" ] || [ -z "$$GHCR_USERNAME" ] || [ -z "$$GHCR_TOKEN" ]; then
        echo "REGISTRY_IMAGE, GHCR_USERNAME, and GHCR_TOKEN must be configured as Buildkite secrets."
        exit 1
      fi

      SOURCE_COMMIT="$(buildkite-agent meta-data get "source-commit")"

      echo "$$GHCR_TOKEN" | docker login ghcr.io \
        --username "$$GHCR_USERNAME" \
        --password-stdin

      set -- \
        --platform linux/amd64 \
        --push \
        --tag "$$REGISTRY_IMAGE:$$SOURCE_COMMIT"
      if [ "$$BUILDKITE_BRANCH" = "main" ]; then
        set -- "$$@" --tag "$$REGISTRY_IMAGE:latest"
      fi

      git archive --format=tar "$$SOURCE_COMMIT" | docker buildx build "$$@" -

  - label: "Create or update Prefect deployment"
    key: prefect-deploy
    depends_on: buildimage
    command: |
      set -euo pipefail

      REGISTRY_IMAGE="$(buildkite-agent secret get REGISTRY_IMAGE)"
      PREFECT_API_URL="$(buildkite-agent secret get PREFECT_API_URL)"
      PREFECT_API_KEY="$(buildkite-agent secret get PREFECT_API_KEY)"

      if [ -z "$$REGISTRY_IMAGE" ] || [ -z "$$PREFECT_API_URL" ] || [ -z "$$PREFECT_API_KEY" ]; then
        echo "REGISTRY_IMAGE, PREFECT_API_URL, and PREFECT_API_KEY must be configured as Buildkite secrets."
        exit 1
      fi

      SOURCE_COMMIT="$(buildkite-agent meta-data get "source-commit")"
      DEPLOY_DIR="$(mktemp -d)"
      git archive --format=tar "$$SOURCE_COMMIT" | tar -xf - -C "$$DEPLOY_DIR"
      cd "$$DEPLOY_DIR"

      curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      export PATH="$$HOME/.local/bin:$$PATH"
      uv sync --locked
      export PREFECT_API_URL
      export PREFECT_API_KEY

      DEPLOY_IMAGE="$$REGISTRY_IMAGE:$$SOURCE_COMMIT"
      uv run prefect deploy \
        --prefect-file prefect.yaml \
        --name ozbargain-latest-deals \
        --job-variable "image=$$DEPLOY_IMAGE" \
        --job-variable 'volumes=["ozbargain-data:/app/data"]'
